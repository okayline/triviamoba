<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriviaMoba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the board (three lanes running in from the edges to the common goal) with the current step's panel under it. Dark by choice: a single committed look. */
:root {
  --ink: #0c1215;
  --panel: #131c21;
  --panel-2: #192630;
  --line: #27363f;
  --fg: #e8efe9;
  --mute: #8fa3a8;
  --def: #5aa7ff;
  --str: #ff9d6c;
  --int: #4fd1c5;
  --clutch: #ff7a45;
  --feed: #5fd38d;
  --tilt: #c58cff;
  --bad: #ff6b6b;
  --f-display: "Chakra Petch", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font: 400 15px/1.45 var(--f-body);
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 28px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.sub { color: var(--mute); font-size: 13px; margin-top: 6px; }
.mono { font-family: var(--f-mono); }
.ver { justify-self: end; margin-top: -6px; font: 400 11px var(--f-mono); color: var(--mute); }   /* the version, under the game panel on the right (a test checks it matches CHANGELOG.md) */
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.seed { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* lanes */
.lane { display: grid; gap: 6px; }
.lane-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lane-name { font: 700 14px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.lane.now .lane-name::after { content: "  ◂ now"; color: var(--mute); font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: none; }
.track { position: relative; height: 34px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
.marker { position: absolute; top: 4px; bottom: 4px; width: 8px; margin-left: -4px; border-radius: 3px; transition: left .5s cubic-bezier(.3,.8,.3,1); }
.fill { position: absolute; top: 0; bottom: 0; left: 0; opacity: .22; transition: width .5s cubic-bezier(.3,.8,.3,1); }
.lane-foot { display: flex; justify-content: space-between; font: 400 12px var(--f-mono); color: var(--mute); gap: 8px; }
.lane-foot b { color: var(--fg); font-weight: 500; }
.c-def { --lc: var(--def); } .c-str { --lc: var(--str); } .c-int { --lc: var(--int); }
.lane .lane-name { color: var(--lc); }
.marker, .fill { background: var(--lc); }

/* heroes */
.heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.hero { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: var(--fg); font: inherit; cursor: pointer; display: grid; gap: 8px; min-width: 0; }
.hero:hover { border-color: var(--mute); }
.hero[aria-pressed="true"] { border-color: var(--fg); background: var(--panel); }
.hero:focus-visible, .btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .slot:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hero-head { display: flex; gap: 8px; align-items: center; }
.badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; line-height: 1; flex: none; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.crit { display: block; font-size: 44px; line-height: 1.1; }
.crit.win { animation: hop .6s ease-out 2; }
.crit.lose { animation: shake .4s ease-in-out 2; filter: grayscale(.6); }
@keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) scale(1.15); } }
@keyframes shake { 25% { transform: translateX(-6px) rotate(-6deg); } 75% { transform: translateX(6px) rotate(6deg); } }
.hero-name { font: 700 16px var(--f-display); }
.hero-slot { font: 500 11px var(--f-mono); color: var(--mute); }

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 8px; text-align: center; color: var(--mute); font: 500 12px var(--f-mono); cursor: pointer; min-width: 0; }
.slot.full { border-style: solid; border-color: var(--lc); color: var(--fg); }
.slot b { display: block; font: 700 16px var(--f-display); color: var(--fg); }

/* controls */
.btn { background: var(--fg); color: var(--ink); border: 0; border-radius: 8px; font: 700 16px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 14px 16px; cursor: pointer; width: 100%; }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.calls { display: grid; gap: 8px; }
.call { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--cc); border-radius: 8px; padding: 12px; color: var(--fg); font: inherit; cursor: pointer; }
.call:hover { border-color: var(--cc); }
.call:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.call b { font: 700 18px var(--f-display); letter-spacing: .06em; color: var(--cc); }
.call span { font: 400 12px/1.4 var(--f-mono); color: var(--mute); }
.k-CLUTCH { --cc: var(--clutch); } .k-FEED { --cc: var(--feed); } .k-TILT { --cc: var(--tilt); }
.tag { color: var(--cc); font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; }

.q { font: 600 20px/1.3 var(--f-body); text-wrap: balance; }
.timer { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.timer > div { height: 100%; width: 100%; background: var(--lc); transition: width .1s linear; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 13px 14px; color: var(--fg); font: 500 16px var(--f-body); cursor: pointer; }
.opt:hover { border-color: var(--mute); }

/* reveal */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side { background: var(--panel-2); border-radius: 8px; padding: 10px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.side .who { font: 500 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.side .hn { font: 700 18px var(--f-display); }
.side .line { font: 400 12px/1.45 var(--f-mono); color: var(--mute); }
.side .pushv { font: 700 24px var(--f-display); margin-top: 2px; }
.pos { color: var(--feed); } .neg { color: var(--bad); }
.verdict { font: 700 22px var(--f-display); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--mute); font: 500 13px var(--f-body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--fg); color: var(--fg); background: var(--panel-2); }
.note { color: var(--mute); font-size: 13px; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.row:first-of-type { border-top: 0; }
.big { font: 700 44px/1 var(--f-display); }
#board { width: min(760px, calc(100vw - 32px)); justify-self: center; }   /* the board is wider than the panels below it */
.fanboard { width: calc(100% + 20px); margin: -6px -10px 0; height: auto; display: block; }
.fanboard .floor { fill: var(--panel-2); opacity: .5; stroke: var(--line); stroke-width: 1; }
.fan { opacity: .6; }
.fan.now { opacity: 1; }
.fanboard .t { fill: var(--line); stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
.fan .t.on { fill: var(--lc); }
.hubg .t { fill: var(--panel-2); stroke: var(--line); }
.fanboard .sd { filter: brightness(.55); }
.fan .shadow { fill: #000; opacity: .45; }
.fan .mk { fill: var(--lc); stroke: var(--fg); stroke-width: 2; }
.tw { fill: var(--mute); stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
.tws { filter: brightness(.55); }
.orb.me, .creep.me { fill: var(--feed); }
.orb.far, .creep.far { fill: var(--bad); }
.creep { stroke: var(--ink); stroke-width: 1; }
.shields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hubt { fill: var(--fg); font: 700 11px var(--f-display); letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { .marker, .fill, .timer > div { transition: none; } .badge, .crit { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TriviaMoba</h1>
    <div class="sub">Prototype with sample data: 3 lanes (DEF, STR, INT), 5 rounds a lane against the map's creep waves. Nothing is saved.</div>
  </header>
  <section id="board" aria-label="Lanes"></section>
  <main id="stage" class="panel" aria-live="polite"></main>
  <div class="ver">v0.4</div>
</div>

<script src="engine/lanes.js"></script>
<script>
// ---- data (all sample content for the prototype) ----
// The lane rules are public/engine/lanes.js (LANES): lanes DEF, STR, INT, played in that order, against the map.
var TODAY = LANES.LANES;
var LABEL = { def: "DEF · History", str: "STR · Body, Moon & Earth", int: "INT · Science & Tech" };
var SHORT = { def: "DEF", str: "STR", int: "INT" };
var ACTION = {
  def: "A right answer pushes forward by your call and puts a shield on any lane: it blocks the next wave there. Reach space 5 to take the tower.",
  str: "A right answer pushes forward by your call. Reach space 5 to take the tower.",
  int: "A right answer heals +1 here, or your lowest lane once this one has its tower. Reach space 5 to take the tower."
};
var SEED = "3f9a·c07e·51b2";
var TIME = 15;                                   // seconds per question
var ROUNDS = LANES.ROUNDS;

var HEROES = [
  { id: "marie", name: "Marie", e: "🦉", c: "#4fd1c5" },
  { id: "atlas", name: "Atlas", e: "🐢", c: "#5aa7ff" },
  { id: "pixel", name: "Pixel", e: "🐙", c: "#f06aa8" },
  { id: "vince", name: "Vince", e: "🦜", c: "#e8d36a" },
  { id: "hale",  name: "Hale",  e: "🦊", c: "#ff9d6c" },
  { id: "echo",  name: "Echo",  e: "🦇", c: "#c58cff" }
];
function hero(id) { return HEROES.filter(function (h) { return h.id === id; })[0]; }

// correct answer first; options are shuffled when shown
var QS = {
  def: [
    { q: "Which of the Seven Wonders of the Ancient World is still standing?", a: ["The Great Pyramid of Giza", "The Lighthouse of Alexandria", "The Colossus of Rhodes", "The Hanging Gardens of Babylon"] },
    { q: "The first email was sent in which decade?", a: ["The 1970s", "The 1950s", "The 1960s", "The 1980s"] },
    { q: "Which of these was invented first?", a: ["The fax machine", "The telephone", "The light bulb", "The radio"] },
    { q: "Teaching at Oxford University had already begun before which of these was founded?", a: ["The Aztec city of Tenochtitlan", "The Colosseum in Rome", "The city of London", "The Great Wall of China"] },
    { q: "In 1974, what was the first product scanned with a barcode at a supermarket checkout?", a: ["A pack of chewing gum", "A can of soup", "A loaf of bread", "A box of cereal"] }
  ],
  str: [
    { q: "Which bone in the human body isn't joined to any other bone?", a: ["The hyoid, in the throat", "The kneecap", "The tailbone", "The stirrup, in the ear"] },
    { q: "The Moon is slowly drifting away from Earth. About how far each year?", a: ["About 4 cm", "About 4 mm", "About 40 cm", "About 4 m"] },
    { q: "Which layer of Earth's atmosphere is the hottest?", a: ["The thermosphere", "The troposphere", "The stratosphere", "The mesosphere"] },
    { q: "About how long does moonlight take to reach Earth?", a: ["About 1 second", "About 8 minutes", "About 1 minute", "It arrives instantly"] },
    { q: "Why do we always see the same side of the Moon?", a: ["Its spin is locked to its orbit", "It doesn't spin at all", "Earth's magnetism holds it still", "Sunlight only lights one side"] }
  ],
  int: [
    { q: "What does the S in HTTPS stand for?", a: ["Secure", "Server", "Standard", "Static"] },
    { q: "Which element has the chemical symbol W?", a: ["Tungsten", "Tin", "Zinc", "Vanadium"] },
    { q: "What number is 1111 in binary?", a: ["15", "11", "16", "4"] },
    { q: "At what temperature are Celsius and Fahrenheit the same?", a: ["−40°", "0°", "−32°", "100°"] },
    { q: "Which of these particles has no electric charge?", a: ["The neutron", "The proton", "The electron", "The positron"] }
  ]
};

// Crowd rounds have no right answer: you score by matching the crowd's pick (drawn by the counts: each option's chance
// is its count out of the people surveyed). Prompts and counts are from ProtoQA (CC BY 4.0, https://github.com/iesl/protoqa-data),
// top four answers only, chosen for no bad vibes. Real SCATTER answers replace them later.
var MYSTERY = [
  { q: "Name something a 17th-century pirate might think the moon was.", a: [["Cheese", 33], ["A star", 23], ["A light", 17], ["A god", 15]] },
  { q: "Name something spies wear to disguise who they are.", a: [["Sunglasses", 38], ["A mask", 27], ["A wig", 27], ["Facial hair", 4]] },
  { q: "Name something a soldier should always have with him.", a: [["A weapon", 62], ["Dog tags", 26], ["A helmet", 2], ["A compass", 2]] },
  { q: "Name a hat you don't see many people wear in real life.", a: [["Top hat", 45], ["Cowboy hat", 28], ["Fedora", 6], ["Straw hat", 5]] },
  { q: "Name something in your home a ghost might turn on and off.", a: [["The lights", 77], ["The TV", 12], ["The radio", 4], ["A fan", 2]] },
  { q: "Name somewhere a little kid thinks a monster is hiding.", a: [["The closet", 59], ["Under the bed", 34], ["The basement", 3], ["The attic", 2]] },
  { q: "Name something a witch could ride if her broom broke.", a: [["A mop", 27], ["A vacuum", 27], ["A stick", 7], ["A bicycle", 7]] },
  { q: "Name something a pirate takes off before bed.", a: [["Eye patch", 32], ["Hook", 24], ["Hat", 21], ["Wooden leg", 7]] },
  { q: "Name something that's harder to do in outer space.", a: [["Breathe", 37], ["Walk", 34], ["Go to the bathroom", 16], ["Eat", 13]] },
  { q: "Name a chore you'd want a robot to do.", a: [["Dishes", 35], ["Laundry", 31], ["Clean the bathroom", 10], ["Vacuum", 10]] }
];

var CALLS = {
  CLUTCH: "Right +2, wrong −2. Push hard.",
  FEED: "Right +1, wrong 0. Play safe.",
  TILT: "Right: coin flip, +3 or −1. Wrong −1."
};

// ---- helpers ----
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function fmt(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); }
function cls(n) { return n > 0 ? "pos" : n < 0 ? "neg" : ""; }

// ---- state ----
var S;
var timerId = null;
function fresh() {
  clearInterval(timerId);
  S = { phase: "draft", lane: 0, round: 0, lineup: [null, null, null], st: LANES.fresh(), rounds: [[], [], []],
        calls: [[], [], []], honesty: [[], [], []], q: null, used: {}, usedM: {}, pending: null };
}
function laneDone(i) { return S.rounds[i].length >= ROUNDS; }
function laneWon(i) { return LANES.won(S.st, i); }

function pickMystery() {
  var pool = MYSTERY.filter(function (_, i) { return !S.usedM[i]; });
  if (!pool.length) pool = MYSTERY;
  var item = pool[Math.floor(Math.random() * pool.length)];
  S.usedM[MYSTERY.indexOf(item)] = true;
  var total = item.a.reduce(function (n, o) { return n + o[1]; }, 0), r = Math.random() * total, pick = item.a[0][0];
  for (var i = 0; i < item.a.length; i++) { r -= item.a[i][1]; if (r < 0) { pick = item.a[i][0]; break; } }
  return { q: item.q, right: pick, opts: shuffle(item.a.map(function (o) { return o[0]; })), mystery: true };   // "right" = the crowd's pick, by the counts
}
function pickQuestion(tag, lane, round) {
  if (LANES.CROWD_ROUNDS.indexOf(round) >= 0) return pickMystery();
  var pool = QS[tag].filter(function (_, i) { return !S.used[tag + i]; });
  if (!pool.length) pool = QS[tag];
  var item = pool[Math.floor(Math.random() * pool.length)];
  S.used[tag + QS[tag].indexOf(item)] = true;
  return { q: item.q, right: item.a[0], opts: shuffle(item.a) };
}

// ---- rendering ----
var $board = document.getElementById("board");
var $stage = document.getElementById("stage");

// The board: a third of a wheel seen tilted from above, flipped: the common goal is the hub at the top, and the three
// lanes start out at the rim and run in to it over 120 degrees, each 5 raised tiles (space 1 at the rim, space 5 by the goal). Positions are worked out on a flat board (x right, y away from you)
// and then squashed by TILT, with every tile given DEPTH pixels of side.
// Tiles light up to your marker as you move in.
var HUB = { x: 200, y: 42 }, ANG = [150, 90, 30], D0 = 30, CELL = 30, LEN = 5 * CELL, TILT = 0.66, DEPTH = 10;
function flat(i, d, off) {
  var a = ANG[i] * Math.PI / 180;
  return { x: Math.cos(a) * d - Math.sin(a) * off, y: Math.sin(a) * d + Math.cos(a) * off };
}
function proj(p) { return { x: +(HUB.x + p.x).toFixed(1), y: +(HUB.y + p.y * TILT).toFixed(1) }; }   // flipped: the hub at the top, the lanes spread out below it
function pts(a) { return a.map(function (p) { return p.x + "," + p.y; }).join(" "); }
function slab(corners, on) {
  var cls = "t" + (on ? " on" : ""), sides = "";
  for (var j = 0; j < corners.length; j++) {
    var p = corners[j], q = corners[(j + 1) % corners.length];
    sides += '<polygon class="' + cls + '" points="' + pts([p, q, { x: q.x, y: q.y + DEPTH }, { x: p.x, y: p.y + DEPTH }]) + '"/>';
  }
  return '<g class="sd">' + sides + '</g><polygon class="' + cls + '" points="' + pts(corners) + '"/>';
}
function ring(cx, cy, r, n) {
  var out = [];
  for (var j = 0; j < n; j++) { var t = j / n * 2 * Math.PI; out.push(proj({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r })); }
  return out;
}
// A tower beside a lane: a tall block with an orb on top, or a low stump once it has fallen. The far tower falls when you take the lane.
function tower(i, d, down, side) {
  var h = down ? 5 : 22, g = [flat(i, d - 7, 15), flat(i, d + 7, 15), flat(i, d + 7, 29), flat(i, d - 7, 29)].map(proj);
  var t = g.map(function (p) { return { x: p.x, y: +(p.y - h).toFixed(1) }; });
  var edges = [0, 1, 2, 3].sort(function (a, b) { return (g[a].y + g[(a + 1) % 4].y) - (g[b].y + g[(b + 1) % 4].y); });
  var sides = edges.map(function (j) { var n = (j + 1) % 4; return '<polygon class="tw" points="' + pts([g[j], g[n], t[n], t[j]]) + '"/>'; }).join("");
  var cx = (t[0].x + t[2].x) / 2, cy = (t[0].y + t[2].y) / 2;
  return '<g class="tws">' + sides + '</g><polygon class="tw top" points="' + pts(t) + '"/>' + (down ? "" : '<circle class="orb ' + side + '" cx="' + cx.toFixed(1) + '" cy="' + (cy - 3).toFixed(1) + '" r="3.5"/>');
}
function isNow(i) { return (S.phase === "call" || S.phase === "question" || S.phase === "shield" || S.phase === "reveal") && S.lane === i; }
function laneState(i) {
  if (laneWon(i)) return "tower taken";
  if (laneDone(i)) return "done";
  return isNow(i) ? "round " + (S.round + 1) + " of " + ROUNDS : "open";
}
function renderBoard() {
  var floor = [proj({ x: 0, y: 0 })];
  for (var a = 150; a >= 30; a -= 10) floor.push(proj({ x: Math.cos(a * Math.PI / 180) * 212, y: Math.sin(a * Math.PI / 180) * 212 }));
  var tiles = [{ y: 0, html: '<g class="hubg">' + slab(ring(0, 0, 26, 18), false) + '<text class="hubt" x="' + HUB.x + '" y="' + (HUB.y - 1) + '" text-anchor="middle" dominant-baseline="central">GOAL</text></g>' }];
  var tokens = [];
  TODAY.forEach(function (tag, i) {
    var k = S.st.k[i], wrap = function (h) { return '<g class="fan c-' + tag + (isNow(i) ? " now" : "") + '">' + h + "</g>"; };
    for (var j = 1; j <= 5; j++) {
      var d0 = D0 + (j - 1) * CELL + 2, d1 = D0 + j * CELL - 2;
      var c = [flat(i, d0, -11), flat(i, d1, -11), flat(i, d1, 11), flat(i, d0, 11)].map(proj);
      tiles.push({ y: flat(i, (d0 + d1) / 2, 0).y, html: wrap(slab(c, 6 - j <= k)) });   // tile j from the hub is space 6 − j
    }
    var pad = flat(i, D0 + LEN + 24, 0);
    var taken = laneWon(i);
    tiles.push({ y: flat(i, D0 + 15, 22).y, html: wrap(tower(i, D0 + 15, taken, "far")) });          // the goal's tower, by the hub
    tiles.push({ y: flat(i, D0 + LEN - 15, 22).y, html: wrap(tower(i, D0 + LEN - 15, false, "me")) });   // your tower, out at the edge
    for (var cj = 1; cj <= 5; cj++) {
      if (cj === k) continue;
      [-5, 5].forEach(function (o) {
        var fp = flat(i, D0 + (5 - cj + 0.5) * CELL, o), sp = proj(fp);
        tokens.push({ y: fp.y, html: wrap('<ellipse class="shadow" cx="' + sp.x + '" cy="' + sp.y + '" rx="4" ry="2"/><circle class="creep ' + (cj < k ? "me" : "far") + '" cx="' + sp.x + '" cy="' + (sp.y - 5) + '" r="3.5"/>') });
      });
    }
    tiles.push({ y: pad.y, html: wrap(slab(ring(pad.x, pad.y, 18, 14), true)) });   // your start pad, lit
    var at = function (n) { return n === 0 ? pad : flat(i, D0 + CELL * (5 - n + 0.5), 0); };   // the middle of space n (0: the start pad)
    var m = proj(at(k));
    tokens.push({ y: at(k).y, html: wrap('<ellipse class="shadow" cx="' + m.x + '" cy="' + m.y + '" rx="9" ry="4.5"/><circle class="mk" cx="' + m.x + '" cy="' + (m.y - 9) + '" r="9"/>') });
  });
  var byFar = function (a, b) { return a.y - b.y; };   // the hub is furthest away now: draw from the top down
  var svg = '<polygon class="floor" points="' + pts(floor) + '"/>' +
    tiles.sort(byFar).map(function (t) { return t.html; }).join("") + tokens.sort(byFar).map(function (t) { return t.html; }).join("");
  var rows = TODAY.map(function (tag, i) {
    var hid = S.lineup[i];
    var me = hid ? hero(hid).e + " " + hero(hid).name : "—";
    var sh = S.st.shields[i] ? " · 🛡 " + S.st.shields[i] : "";
    return '<div class="lane c-' + tag + (isNow(i) ? " now" : "") + '">' +
      '<div class="lane-top"><span class="lane-name">' + LABEL[tag] + '</span>' +
      '<span class="label">' + (S.st.k[i] ? "space " + S.st.k[i] + " of 5" : "start pad") + " · " + laneState(i) + sh + "</span></div>" +
      '<div class="lane-foot"><span>you: <b>' + me + "</b></span></div></div>";
  }).join("");
  $board.innerHTML = '<div class="panel"><svg class="fanboard" viewBox="0 12 400 200" role="img" aria-label="Three lanes of five tiles running in from the edge to the common goal at the top, seen from above">' + svg + "</svg>" + rows + "</div>";
}

function renderDraft() {
  var picked = S.lineup.filter(Boolean).length;
  var slots = TODAY.map(function (tag, i) {
    var id = S.lineup[i];
    return '<button class="slot c-' + tag + (id ? " full" : "") + '" data-act="slot" data-i="' + i + '">' +
      (id ? "<b>" + hero(id).e + " " + hero(id).name + "</b>" : "<b>Empty</b>") + SHORT[tag] + "</button>";
  }).join("");
  var cards = HEROES.map(function (h) {
    var at = S.lineup.indexOf(h.id);
    return '<button class="hero" data-act="hero" data-id="' + h.id + '" aria-pressed="' + (at >= 0) + '">' +
      '<div class="hero-head"><span class="badge" style="background:' + h.c + '">' + h.e + '</span><div><div class="hero-name">' + h.name + '</div>' +
      '<div class="hero-slot">' + (at >= 0 ? SHORT[TODAY[at]] : "bench") + "</div></div></div></button>";
  }).join("");
  $stage.innerHTML =
    '<div class="seed"><span class="label">Day seed</span><span class="mono">' + SEED + '</span><span class="label">3 lanes sealed</span></div>' +
    "<h2>Draft your lanes</h2>" +
    '<div class="note">Pick 3 of 6 heroes, one per lane. You play DEF first, then STR, then INT, 5 rounds each. Every wrong answer lets the map\'s creep wave push you back a space.</div>' +
    '<div class="slots">' + slots + "</div>" +
    '<div class="heroes">' + cards + "</div>" +
    '<button class="btn" data-act="lock"' + (picked < 3 ? " disabled" : "") + ">Lock lineup</button>";
}

function renderCall() {
  var tag = TODAY[S.lane];
  $stage.innerHTML =
    '<div class="lane c-' + tag + '"><span class="lane-name">' + LABEL[tag] + " · round " + (S.round + 1) + " of " + ROUNDS + "</span></div>" +
    "<h2>Commit a call</h2>" +
    '<div class="note">You see the question after you commit. ' + ACTION[tag] + "</div>" +
    '<div class="calls">' + Object.keys(CALLS).map(function (k) {
      return '<button class="call k-' + k + '" data-act="call" data-k="' + k + '"><b>' + k + "</b><span>" + CALLS[k] + "</span></button>";
    }).join("") + "</div>";
}

function renderQuestion() {
  var tag = TODAY[S.lane], q = S.q;
  $stage.innerHTML =
    '<div class="seed c-' + tag + '"><span class="lane-name">' + SHORT[tag] + " · round " + (S.round + 1) + '</span><span class="label">called <span class="tag k-' + S.calls[S.lane][S.round] + '">' + S.calls[S.lane][S.round] + "</span></span></div>" +
    '<div class="timer c-' + tag + '"><div id="tbar"></div></div>' +
    '<div class="q">' + q.q + "</div>" + (q.mystery ? '<div class="note">Crowd round: there is no right answer. You score if you match the crowd.</div>' : "") +
    '<div class="opts">' + q.opts.map(function (o, i) { return '<button class="opt" data-act="answer" data-i="' + i + '">' + o + "</button>"; }).join("") + "</div>";
  var end = Date.now() + TIME * 1000, bar = document.getElementById("tbar");
  clearInterval(timerId);
  timerId = setInterval(function () {
    var left = end - Date.now();
    if (left <= 0) { clearInterval(timerId); resolve(null); return; }
    bar.style.width = (left / (TIME * 1000) * 100) + "%";
  }, 100);
}

function answeredLine(r) {
  return S.q.mystery
    ? (r.pick === null ? "Time's up. " : "") + "No right answer. The crowd picked " + S.q.right + (r.right ? ": you matched it." : ": you didn't match it.")
    : r.pick === null ? "Time's up. It was " + S.q.right + "." : (r.right ? "Correct: " + S.q.right : "Wrong. It was " + S.q.right + ".");
}

// A right DEF answer: pick the lane your shield goes on, then the round is played.
function renderShield() {
  $stage.innerHTML =
    '<div class="label">Round ' + (S.round + 1) + " of " + ROUNDS + '</div>' +
    '<div class="verdict c-def">Place your shield</div>' +
    '<div class="note">' + answeredLine(S.pending) + " Pick a lane: the shield blocks the next wave there.</div>" +
    '<div class="shields">' + TODAY.map(function (tag, i) {
      return '<button class="slot full c-' + tag + '" data-act="shield" data-i="' + i + '"><b>🛡 ' + SHORT[tag] + "</b>space " + S.st.k[i] + "</button>";
    }).join("") + "</div>";
}

function renderReveal() {
  var i = S.lane, ri = S.round, tag = TODAY[i], r = S.rounds[i][ri], ev = r.ev, me = hero(S.lineup[i]);
  var call = S.calls[i][ri], done = laneDone(i), moved = ev.to[i] - ev.from[i];
  var verdict = ev.shield !== undefined ? (moved > 0 ? "Pushed, shield on " : "Shield on ") + SHORT[TODAY[ev.shield]]
    : ev.healed !== undefined ? "Healed " + SHORT[TODAY[ev.healed]] + " +1"
    : ev.blocked ? "Wave blocked"
    : moved > 0 ? "You push the lane" : moved < 0 ? "Pushed back" : "Held";
  if (done) verdict = laneWon(i) ? "Tower taken" : "Lane done";
  var how = ev.right ? "" : " The wave " + (ev.blocked ? "was blocked by your shield." : "pushed you back 1.");
  var last = i === 2;
  $stage.innerHTML =
    '<div class="label">Round ' + (ri + 1) + " of " + ROUNDS + '</div>' +
    '<div class="verdict c-' + tag + '">' + verdict + "</div>" +
    '<div class="note">' + answeredLine(r) + (call === "TILT" && ev.right && tag !== "int" ? " TILT landed " + (r.heads ? "heads (+3)." : "tails (−1).") : "") + how + " Marker on space " + S.st.k[i] + " of 5.</div>" +
    '<div class="cols">' +
      '<div class="side"><span class="who">You</span><span class="crit ' + (moved > 0 || ev.shield !== undefined || ev.healed !== undefined ? "win" : moved < 0 ? "lose" : "") + '">' + me.e + '</span><span class="hn">' + me.name + '</span><span class="line"><span class="tag k-' + call + '">' + call + "</span> · " + SHORT[tag] + '</span><span class="pushv ' + cls(moved) + '">' + fmt(moved) + "</span></div>" +
    "</div>" +
    (S.q.mystery ? '<div class="note">Nothing to look up on this one.</div>' : '<div><div class="label" style="margin-bottom:8px">How did you get it? (no points either way)</div><div class="chips">' +
      ["I knew it", "I guessed", "I looked it up"].map(function (t, k) {
        return '<button class="chip" data-act="honest" data-k="' + k + '" aria-pressed="' + (S.honesty[i][ri] === k) + '">' + t + "</button>";
      }).join("") + "</div></div>") +
    '<button class="btn" data-act="next">' + (!done ? "Next round" : last ? "See result" : "Next lane") + "</button>";
}

function renderResult() {
  var won = [0, 1, 2].filter(laneWon).length, hon = [0, 0, 0];
  S.honesty.forEach(function (hs) { hs.forEach(function (k) { if (k !== undefined) hon[k]++; }); });
  var head = won >= 2 ? "You win" : "";   // no big headline otherwise
  $stage.innerHTML =
    '<div class="label">Result</div>' + (head ? '<div class="big">' + head + "</div>" : "") +
    '<div class="note">' + won + " of 3 lanes won, over " + S.rounds.reduce(function (a, rs) { return a + rs.length; }, 0) + " questions.</div>" +
    "<div>" + [0, 1, 2].map(function (i) {
      return '<div class="row c-' + TODAY[i] + '"><span><span class="lane-name">' + SHORT[TODAY[i]] + "</span> · " + hero(S.lineup[i]).e + " " + hero(S.lineup[i]).name + '</span><span class="mono ' + (laneWon(i) ? "pos" : "") + '">' + (S.st.k[i] ? "space " + S.st.k[i] : "start pad") + " · " + laneState(i) + "</span></div>";
    }).join("") + "</div>" +
    '<div class="note">Declared: ' + hon[0] + " knew, " + hon[1] + " guessed, " + hon[2] + " looked up.</div>" +
    '<button class="btn" data-act="again">Play again</button>';
}

function render() {
  renderBoard();
  if (S.phase === "draft") renderDraft();
  else if (S.phase === "call") renderCall();
  else if (S.phase === "question") renderQuestion();
  else if (S.phase === "shield") renderShield();
  else if (S.phase === "reveal") renderReveal();
  else renderResult();
}

// ---- actions ----
function playRound(r, shieldLane) {
  var i = S.lane, ri = S.round;
  r.ev = LANES.play(S.st, i, S.calls[i][ri], r.right, r.heads, shieldLane);
  S.rounds[i].push(r);
  S.pending = null;
  S.phase = "reveal";
}
function resolve(pick) {
  clearInterval(timerId);
  var r = { pick: pick, right: pick !== null && S.q.opts[pick] === S.q.right, heads: Math.random() < 0.5 };
  if (r.right && TODAY[S.lane] === "def") { S.pending = r; S.phase = "shield"; }
  else playRound(r);
  render();
}

document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  var act = b.getAttribute("data-act");
  if (act === "hero") {
    var id = b.getAttribute("data-id"), at = S.lineup.indexOf(id);
    if (at >= 0) S.lineup[at] = null;
    else { var free = S.lineup.indexOf(null); if (free >= 0) S.lineup[free] = id; }
  } else if (act === "slot") {
    if (S.phase !== "draft") return;
    S.lineup[+b.getAttribute("data-i")] = null;
  } else if (act === "lock") {
    S.phase = "call"; S.lane = 0; S.round = 0;
  } else if (act === "call") {
    S.calls[S.lane][S.round] = b.getAttribute("data-k");
    S.q = pickQuestion(TODAY[S.lane], S.lane, S.round);
    S.phase = "question";
  } else if (act === "answer") {
    resolve(+b.getAttribute("data-i")); return;
  } else if (act === "shield") {
    playRound(S.pending, +b.getAttribute("data-i"));
  } else if (act === "honest") {
    S.honesty[S.lane][S.round] = +b.getAttribute("data-k");
  } else if (act === "next") {
    if (!laneDone(S.lane)) { S.round++; S.phase = "call"; }
    else if (S.lane === 2) S.phase = "result";
    else { S.lane++; S.round = 0; S.phase = "call"; }
  } else if (act === "again") {
    fresh();
  }
  render();
});

fresh();
render();
</script>
</body>
</html>
